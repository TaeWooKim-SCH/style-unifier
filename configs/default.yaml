# configs/default.yaml
# style-unifier 기본 설정 파일.
# 하이퍼파라미터는 이 파일에서 관리한다. 코드에 직접 값을 하드코딩하지 않는다.
# 실험별 override는 experiments/NNN_name/config.yaml 에서 이 파일을 base로 사용.

model:
  base_checkpoint: "cagliostrolab/animagine-xl-3.1"
  vae: "madebyollin/sdxl-vae-fp16-fix"

  ip_adapter:
    repo: "h94/IP-Adapter"
    subfolder: "sdxl_models"
    weight_name: "ip-adapter-plus_sdxl_vit-h.safetensors"
    # 0.7 (변화 없음) -> 1.0 (artifact) -> 0.8 (balanced) (2026-05-14 B 게이트)
    scale: 0.8

  controlnet:
    - type: "lineart"
      # lineart 전용 체크포인트가 없어 canny-sdxl로 임시 대체 (그룹 E에서 재검토)
      repo: "diffusers/controlnet-canny-sdxl-1.0"
      # 0.9 (변화 없음) -> 0.6 (형태 깨짐) -> 0.8 (balanced) (2026-05-14)
      scale: 0.8
      enabled: true
    - type: "depth"
      repo: "diffusers/controlnet-depth-sdxl-1.0"
      scale: 0.5
      # depth는 그룹 E 이후 활성화 예정
      enabled: false

sampling:
  scheduler: "DPMSolverMultistepScheduler"
  scheduler_config:
    use_karras_sigmas: true
    algorithm_type: "sde-dpmsolver++"
  steps: 25
  cfg_scale: 6.0
  # 0.55 (변화 없음) -> 0.7 (artifact) -> 0.5 (balanced) (2026-05-14)
  denoising_strength: 0.5
  # null이면 랜덤 동작. 재현 시 정수 seed를 명시할 것 (CLAUDE.md 결정론적 재현성 원칙)
  seed: null

preprocessing:
  bg_removal_model: "briaai/RMBG-1.4"
  # lineart detector: "lineart_anime" | "lineart_realistic" | "canny"
  # 2026-05-14: lineart_anime의 anti-aliased grayscale 라인이 ControlNet canny-sdxl 모델
  # (binary edge 학습)과 mismatch → fragment artifact 발생. canny detector로 통일하여
  # conditioning 정합. lineart-specific SDXL 체크포인트 출시 시 lineart_anime 복귀 검토.
  lineart_detector: "canny"
  target_size: 1024
  preserve_aspect_ratio: true

postprocessing:
  # palette_quantize: 결과 색상을 source 팔레트로 강제 환원. B 게이트 검증에서
  # reference 색감이 후처리에서 무효화되는 문제 발견 → 기본 비활성화로 변경 (2026-05-14).
  # 배치 일관성 (D1) 사용 시 batch_consistency.enforce_consistency 가 별도로 처리.
  palette_quantize: false
  palette_k: 12
  # palette_strength: 0.7 -> 0.3 (활성화 시에도 reference 영향을 더 살림)
  palette_strength: 0.3
  # alpha 경계 feathering 반경 (px). 0이면 feathering 없음
  alpha_feather: 1

output:
  # 최종 출력은 RGBA를 유지한다 (CLAUDE.md 절대 원칙 §4)
  rgba: true
  # 생성 해상도. RTX 4070 12GB VRAM 한계를 고려해 1024 이하로 유지
  target_size: 1024

evaluation:
  metrics:
    - clip_style_similarity
    - lpips_structure
    - palette_distance
    - dino_identity

logging:
  # 기본 로그 레벨. 환경변수 STYLE_UNIFIER_LOG_LEVEL 로 override 가능
  level: "INFO"
